<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>量化学术网站｜Kline Quant</title><meta name="description" content="量化金融学术排名、论文与研究网站总入口"><style>
:root{--bg:#f7fafc;--ink:#102a43;--soft:#486581;--blue:#1d5d8f;--line:#d9e2ec;--accent:#d89b3d}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.65 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}a{color:var(--blue)}.sidebar{position:fixed;inset:0 auto 0 0;width:225px;background:#102a43;color:white;padding:26px 17px;z-index:2;overflow:auto}.sidebar .brand{color:white;font:700 28px Georgia,serif;text-decoration:none;display:block;margin-bottom:36px}.sidebar .tag{font-size:10px;letter-spacing:2px;color:#a4bbcd;margin:20px 13px}.sidebar a.nav{display:block;color:#d5e3ef;text-decoration:none;padding:11px 13px;margin:6px 0;border-radius:4px}.sidebar a.nav:hover,.sidebar a.active{background:#294863;color:white}.wrap{max-width:1170px;margin-left:245px;padding:0 25px}.head{padding:59px 0 28px}.eyebrow{font-size:11px;color:var(--blue);letter-spacing:2px;font-weight:700}h1{font:700 clamp(38px,5vw,60px) Georgia,"Songti SC",serif;margin:13px 0}.head p{color:var(--soft);max-width:810px}.search{display:flex;gap:10px;flex-wrap:wrap;padding:17px 0;border-block:1px solid var(--line)}input,select{font:inherit;padding:12px;background:white;border:1px solid var(--line);color:var(--ink)}input{flex:1;min-width:220px}.count{color:var(--soft);font-size:13px;margin:18px 0}.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:20px 0 52px}.site{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:19px 20px;border:1px solid var(--line);background:white;text-decoration:none;color:var(--ink);transition:border-color .2s}.site:hover{border-color:var(--blue)}.site b{display:block;font-size:16px}.site small{display:block;color:var(--soft);font-size:11px;overflow-wrap:anywhere}.note{padding:15px 20px;background:#eef3f7;border-left:3px solid var(--accent);font-size:12px;color:var(--soft);margin-bottom:44px}footer{border-top:1px solid var(--line);color:var(--soft);padding:20px 0 38px}@media(max-width:800px){.sidebar{position:relative;inset:auto;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:12px}.sidebar .brand{margin:0 12px 0 0;font-size:22px}.sidebar .tag{display:none}.sidebar a.nav{display:inline-block;margin:0;padding:6px 9px}.wrap{margin:0 auto;padding:0 16px}.head{padding:32px 0 22px}}
</style></head><body><aside class="sidebar"><a class="brand" href="../../">Kline<span style="color:var(--accent)">.</span></a><div class="tag">QUANT RESEARCH</div><a class="nav" href="../">量化公司</a><a class="nav" href="../assets/">金融资产类别</a><a class="nav active" href="./" aria-current="page">学术排名与资源</a><a class="nav" href="../news/">全球宏观 News</a><div class="tag">MAIN</div><a class="nav" href="../../">个人主页</a></aside><div class="wrap"><main><header class="head"><div class="eyebrow">ACADEMIC & QUANT RESOURCE PORTALS</div><h1>学术网站总入口<span style="color:var(--accent)">.</span></h1><p>QuantNet、学科排名、研究论文、期刊与金融数据网站汇总。这里仅保留各机构或平台的<strong>总网站入口</strong>，不展开子排名、期刊栏目或单篇论文。</p></header><div class="search"><input type="search" id="q" placeholder="搜索 QuantNet、RePEc、arXiv…" aria-label="搜索网站"><select id="cat" aria-label="网站类别"><option value="">全部类型</option></select></div><p id="count" class="count">载入中…</p><div id="sites" class="sites" aria-live="polite"></div><div class="note">站点链接为官方网站主页，非具体榜单页面。榜单版本、排名方法和订阅权限请进入相应网站核查。某些站点有多个研究领域，仅显示一次。</div></main><footer>© Kline Quant · <a href="../">返回量化板块</a></footer></div><script>
let sites=[];const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function draw(){const q=$("q").value.toLowerCase().trim(),c=$("cat").value;const res=sites.filter(s=>(!q||[s.name,s.url,...s.categories].join(" ").toLowerCase().includes(q))&&(!c||s.categories.includes(c)));$("count").textContent="网站 "+res.length+" / "+sites.length+" 个";$("sites").innerHTML=res.map(s=>'<a class="site" href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer"><div><b>'+esc(s.name)+'</b><small>'+esc(s.url)+'</small></div><span aria-hidden="true">↗</span></a>').join("")||"没有匹配的网站。"}$("q").addEventListener("input",draw);$("cat").addEventListener("change",draw);fetch("./sites.json").then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(d=>{sites=d.sites||[];[...new Set(sites.flatMap(s=>s.categories))].sort().forEach(c=>$("cat").add(new Option(c,c)));draw()}).catch(e=>$("sites").textContent="加载失败："+e.message);
</script></body></html>
