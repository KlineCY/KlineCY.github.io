        run: node quant/math/test_v33_highfreq_ml_bridge.mjs
      - name: Verify V34 all 123 canonical core maths lectures, 140 KaTeX proofs and Atlas links
        run: node quant/math/test_v34_complete_canonical_core.mjs
      - name: V89 verify 12 truly new complete foundational math lectures, 144 strict formulas and 336 loaded topics
        run: node quant/math/test_v89_12_complete_foundation_lessons.mjs
      - name: V91 verify append-only 12-lesson foundation deepening, strict KaTeX and proof corrections
        run: node quant/math/test_v91_foundation_deepening.mjs
      - name: V92 verify sixteen complete linear algebra lessons, strict KaTeX, numerical proofs, and CJK
        run: node quant/math/test_v92_linear_spectral_foundations.mjs
      - name: V93 validate twelve complete matrix and probability lectures and strict mathematical worked cases
        run: node quant/math/test_v93_matrix_probability_foundations.mjs
      - name: V94 validate twelve complete Bayesian and conditional probability lectures and strict KaTeX
        run: node quant/math/test_v94_bayesian_probability_foundations.mjs
      - name: V95 validate fourteen complete classical statistics inference lectures, KaTeX and 40 numeric proofs
        run: node quant/math/test_v95_statistical_inference_core.mjs
      - name: V96 verify fourteen complete convex optimization lessons and strict duality / conic numerics
        run: node quant/math/test_v96_convex_optimization_core.mjs
      - name: V97 validate all optimization lessons, portfolio numerical solvers, strict KaTeX and 70 independent checks
        run: node quant/math/test_v97_portfolio_numerical_solvers.mjs
      - name: V98 validate six ODE foundations, repaired V90 loader, 54 KaTeX and independent numerics
        run: node quant/math/test_v98_diffeq_foundations.mjs
      - name: V99 validate 30/30 differential equations, 198 KaTeX, Chinese study path and numerical proofs
        run: node quant/math/test_v99_dynamics_pde_controls.mjs
      - name: V100 validate 36/36 finance, 153 strict KaTeX, quantitative arithmetic and CJK layout
        run: node quant/math/test_v100_finance_complete.mjs
      - name: V101 validate time-series and risk mathematics 36/36 each, 153 KaTeX and numerical proofs
        run: node quant/math/test_v101_timeseries_risk_complete.mjs
      - name: V102 validate ML mathematics 36/36, 108 strict KaTeX and independent gradient numerical proofs
        run: node quant/math/test_v102_mlmath_complete.mjs
      - name: V103 validate information-signal mathematics 32/32, 162 strict KaTeX and independent signal proof checks
        run: node quant/math/test_v103_information_complete.mjs
      - name: V104 validate discrete graph and financial networks 30/30, 252 strict KaTeX and 120+ numerical proofs
        run: node quant/math/test_v104_discrete_complete.mjs
      - name: V105 validate control, games and market-making 30/30, 252 strict KaTeX and 140+ numerical proofs
        run: node quant/math/test_v105_control_complete.mjs
      - name: V88 validate 33 information/sequence lectures, 66 strict formulas and frozen original text
        run: node quant/math/test_v88_33_information_sequence.mjs
      - name: V87 verify 31 math and ML lectures, 62 strict formulas, original snapshots and numerical checks
        run: node quant/math/test_v87_31_rigorous_lessons.mjs
      - name: V86 validate 29 math and ML Atlas live lessons, 58 strict formulas and preserved original text
        run: node quant/math/test_v86_29_rigorous_math_ml.mjs
      - name: V85 verify 27 live quant math and ML lessons, 54 strict formulas and frozen original content
        run: node quant/math/test_v85_27_rigorous_lessons.mjs
      - name: V84 validate 25 live mathematical and Atlas courses, 50 strict KaTeX formulas, snapshots and numeric invariants
        run: node quant/math/test_v84_25_lesson_integrity.mjs
      - name: V83 verify 21 live mathematical and ML courses, strict KaTeX, original content and arithmetic
        run: node quant/math/test_v83_21_math_ml_addenda.mjs
      - name: V82 verify 10 mathematical foundations addenda, original snapshots, strict KaTeX and numeric cases
        run: node quant/math/test_v82_10_foundation_addenda.mjs
      - name: V81 validate 30 generative, RL, time-series and production finance lectures
        run: node quant/math/test_v81_30_lesson_depth.mjs
      - name: V80 validate 60 deepened ML lectures, strict KaTeX, financial numerics and original-content fingerprints
        run: node quant/math/test_v80_60_lesson_integrity.mjs
      - name: V79 verify 62 original lessons, strict mathematical proof, numeric cases and CJK layout
        run: node quant/math/test_v79_62_lesson_integrity.mjs
      - name: V78 verify 56 live ML lessons, preserved source content, strict KaTeX and financial numerics
        run: node quant/math/test_v78_56_live_lesson_integrity.mjs
      - name: V77 validate 52 lectures, strict KaTeX, system-risk proofs and Chinese layout
        run: node quant/math/test_v77_52_systematic_lessons.mjs
      - name: V76 validate 45 live lessons, strict KaTeX, Chinese layout and independent numeric cases
        run: node quant/math/test_v76_45_lecture_integrity.mjs
      - name: V75 verify 46 lessons, source-vintage fix, strict KaTeX, CJK and financial numerics
        run: node quant/math/test_v75_46_financial_ml_depth.mjs
      - name: V74 verify 42 lectures with strict KaTeX, CJK typography and independent numerics
        run: node quant/math/test_v74_42_lesson_depth.mjs
      - name: V73 validate 34 deepened lessons, strict KaTeX, numerics and original-content guards
        run: node quant/math/test_v73_34_lesson_integrity.mjs
      - name: V72 verify 24 deepened lessons, strict math, independent numerics and CJK layout
        run: node quant/math/test_v72_extended_consistency.mjs
      - name: V70 validate 32 advanced econometrics and ML lessons, 60 numeric cases and CJK KaTeX
        run: node quant/math/test_v70_econometrics_generative_rl.mjs
      - name: V69 validate SDF, execution and 23 ML lectures, 53 arithmetic checks, strict KaTeX and CJK
        run: node quant/math/test_v69_sdf_execution_ml.mjs
      - name: V68 validate 32 causal and ML lectures, 62 numeric cases, strict KaTeX and CJK
        run: node quant/math/test_v68_causal_optimization_ml.mjs
      - name: V67 validate 31 rigorous training and ML lessons, 45 numerical cases and responsive CJK/KaTeX
        run: node quant/math/test_v67_training_robustness_ml.mjs
      - name: V66 validate 31 time-series and ML lessons, KaTeX, independent arithmetic and CJK layout
        run: node quant/math/test_v66_timeseries_ml_inference.mjs
      - name: V65 validate 27 cointegration and ML lessons, numerical examples and CJK KaTeX layout
        run: node quant/math/test_v65_cointegration_ml_foundations.mjs
      - name: V64 verify 26 curriculum lessons, strict math, CJK layout and independent arithmetic
        run: node quant/math/test_v64_foundations_calibration.mjs
      - name: V63 verify 18 dynamic-risk and ML lessons, numerical proof checks and CJK typography
        run: node quant/math/test_v63_dynamics_generalization.mjs
      - name: V62 check 15 robust inference and ML forecasting lessons, KaTeX and numerical identities
        run: node quant/math/test_v62_robust_forecasting.mjs
      - name: V61 verify Bayesian and particle math plus six ML fundamentals
        run: node quant/math/test_v61_bayesian_smc_ml.mjs
      - name: V60 verify filtering and six ML foundations, KaTeX and numerical identities
        run: node quant/math/test_v60_foundations.mjs
      - name: V59 verify bootstrap curve, exact OU/CIR transitions and strict KaTeX
        run: node quant/math/test_v59_term_structure.mjs
