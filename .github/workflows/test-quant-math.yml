name: Validate quant mathematics
on:
  push:
    branches: [main]
    paths:
      - 'quant/math/**'
      - 'quant/sidebar-v2.js'
      - '.github/workflows/test-quant-math.yml'
  pull_request:
    paths:
      - 'quant/math/**'
      - 'quant/sidebar-v2.js'
      - '.github/workflows/test-quant-math.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated KaTeX parser for formula QA
        run: npm install --no-save --no-package-lock katex@0.16.11
      - name: Validate content and LaTeX proof formula syntax
        run: node quant/math/test_math.mjs
      - name: Independently verify mathematical worked examples
        run: node quant/math/test_math_examples.mjs
      - name: Verify V2 proof chain, full chapters and cross-discipline learning path
        run: node quant/math/test_v2_linear_chain.mjs
      - name: Verify expanded QR, BLUE, regularization, model selection and formula readability
        run: node quant/math/test_v2_extension.mjs
      - name: Verify ERM, VC, RKHS, proximal optimization, covariance maths and advanced reading layout
        run: node quant/math/test_v2_generalization_kernel_risk.mjs
      - name: Verify V3 regularization stability, kernel approximation and robust statistics with typography
        run: node quant/math/test_v3_stability_robust.mjs
      - name: Verify empirical distributions, quantile regression and VaR-ES risk proofs
        run: node quant/math/test_v4_tailrisk_calibration.mjs
      - name: Verify CRPS, PIT, proper log scoring and distribution shift with keyboard-accessible math
        run: node quant/math/test_v5_proper_scores_shift.mjs
      - name: Verify Bayes, conditional expectation, total variance, and financial forecast prerequisites
        run: node quant/math/test_probability_foundations_v7.mjs
      - name: Verify V8 financial inference, Bootstrap, stopping and CJK math layout
        run: node quant/math/test_inference_stopping_v8.mjs
      - name: Verify V9 LLN, Hilbert projections, martingales and nonnegative maximal bounds
        run: node quant/math/test_foundations_martingale_v9.mjs
      - name: Verify V10 convergence modes, Lp, Borel Cantelli, Levy, filtrations, Doob and martingales
        run: node quant/math/test_convergence_martingale_v10.mjs
      - name: Validate V11 measure-theoretic foundations, 60 derivations and mathematics/ML links
        run: node quant/math/test_measure_integration_v11.mjs
      - name: Verify V12 Bernoulli, random walks, renewal, Markov, CTMC and execution-queue theorems
        run: node quant/math/test_stochastic_processes_v12.mjs
      - name: Verify V13 dynamic control, Hawkes, Brownian, Ito integrals and multi-factor calculus
        run: node quant/math/test_dynamic_brownian_v13.mjs
      - name: Verify V14 SDE, OU/CIR, Euler, measure-change, Feynman-Kac and jump-pricing proofs
        run: node quant/math/test_sde_risk_neutral_v14.mjs
      - name: Verify V15 live MES/CoVaR lessons, conditional system risk and KaTeX/CJK coverage
        run: node quant/math/test_systemic_risk_v15.mjs
      - name: Verify V17 econometric identification, IV, GMM, robust inference, 240 lessons and CJK typesetting
        run: node quant/math/test_econometrics_v17.mjs
      - name: Verify V18 SDF pricing, ETF execution, robust optimization, 252 lessons and Chinese KaTeX
        run: node quant/math/test_pricing_execution_v18.mjs
      - name: Verify V19 causal econometrics, event studies, Fama-MacBeth, HC3, survivorship and 253 lessons
        run: node quant/math/test_financial_identification_v19.mjs
      - name: Verify V20 DML causal targets, partial identification, proximal optimization and 258 unique courses
        run: node quant/math/test_causal_proximal_v20.mjs
      - name: Verify V21 financial ML training, honest validation, SGD/Adam, sparse regularization and 266 courses
        run: node quant/math/test_financial_ml_training_v21.mjs
      - name: Verify V22 Wold, white noise, ARMA/ARIMA, AIC-BIC, ADF-KPSS and 274 unique maths lectures
        run: node quant/math/test_time_series_foundations_v22.mjs
      - name: Verify V23 Engle-Granger/Johansen cointegration, ECM, stable VAR and 278 unique lectures
        run: node quant/math/test_cointegration_vecm_var_v23.mjs
      - name: Verify V24 dependent-data inference, HAC Sharpe, Rademacher complexity and 282 lectures
        run: node quant/math/test_inference_generalization_v24.mjs
      - name: Verify V25 high-frequency econometrics, Hawkes calibration, KL robustness and 287 lectures
        run: node quant/math/test_microstructure_dro_tailrisk_v25.mjs
      - name: Verify V26 impulse response, FEVD, Granger, EGARCH, DCC, ARFIMA and Hamilton filtering
        run: node quant/math/test_dynamic_risk_v26.mjs
      - name: Verify V27 Jackknife, BCa, permutation, M-estimation, FDR, Euler risk, stress and PBO
        run: node quant/math/test_robust_inference_risk_v27.mjs
      - name: Verify V28 Bayesian posterior, conjugacy, credible intervals and BSM options risk
        run: node quant/math/test_bayesian_options_v28.mjs
      - name: Verify V29 state space, sequential Bayes, HMM, EKF, particles and path-dependent drawdowns
        run: node quant/math/test_sequential_filtering_v29.mjs
      - name: Verify V30 martingale measures, complete markets, yield curves, Vasicek and CIR rates
        run: node quant/math/test_arbitrage_rates_v30.mjs
