name: Validate quant mathematics
on:
  push:
    branches: [main]
    paths:
      - 'quant/math/**'
      - 'quant/sidebar-v2.js'
      - '.github/workflows/test-quant-math.yml'
  pull_request:
    paths:
      - 'quant/math/**'
      - 'quant/sidebar-v2.js'
      - '.github/workflows/test-quant-math.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated KaTeX parser for formula QA
        run: npm install --no-save --no-package-lock katex@0.16.11
      - name: Validate content and LaTeX proof formula syntax
        run: node quant/math/test_math.mjs
      - name: Independently verify mathematical worked examples
        run: node quant/math/test_math_examples.mjs
      - name: Verify V2 proof chain, full chapters and cross-discipline learning path
        run: node quant/math/test_v2_linear_chain.mjs
      - name: Verify expanded QR, BLUE, regularization, model selection and formula readability
        run: node quant/math/test_v2_extension.mjs
      - name: Verify ERM, VC, RKHS, proximal optimization, covariance maths and advanced reading layout
        run: node quant/math/test_v2_generalization_kernel_risk.mjs
      - name: Verify V3 regularization stability, kernel approximation and robust statistics with typography
        run: node quant/math/test_v3_stability_robust.mjs
      - name: Verify empirical distributions, quantile regression and VaR-ES risk proofs
        run: node quant/math/test_v4_tailrisk_calibration.mjs
      - name: Verify CRPS, PIT, proper log scoring and distribution shift with keyboard-accessible math
        run: node quant/math/test_v5_proper_scores_shift.mjs
      - name: Verify Bayes, conditional expectation, total variance, and financial forecast prerequisites
        run: node quant/math/test_probability_foundations_v7.mjs
      - name: Verify V8 financial inference, Bootstrap, stopping and CJK math layout
        run: node quant/math/test_inference_stopping_v8.mjs
      - name: Verify V9 LLN, Hilbert projections, martingales and nonnegative maximal bounds
        run: node quant/math/test_foundations_martingale_v9.mjs
