name: Validate C++ educational examples

on:
  push:
    paths:
      - 'quant/math/cpp-examples.json'
      - 'quant/ml/atlas-cpp-examples.json'
      - 'quant/ml/test_cpp_examples.py'
      - '.github/workflows/validate-cpp-education.yml'
  pull_request:
    paths:
      - 'quant/math/cpp-examples.json'
      - 'quant/ml/atlas-cpp-examples.json'
      - 'quant/ml/test_cpp_examples.py'
      - '.github/workflows/validate-cpp-education.yml'

jobs:
  education-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and execute all mathematical and ML C++ examples
        run: python quant/ml/test_cpp_examples.py
