name: Refresh official macro news archive
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-news-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect RSS from official institutions
        run: python scripts/collect_macro_news.py
      - name: Commit the rolling news archive
        run: |
          if git diff --quiet -- quant/news/news.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quant/news/news.json
          git commit -m "data(news): refresh rolling macro announcements"
          git push
