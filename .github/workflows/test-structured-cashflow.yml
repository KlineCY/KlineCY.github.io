name: Validate structured mortgage cash flows
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  structured-cashflow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/test_structured_cashflow.py ${{ matrix.compiler }}
