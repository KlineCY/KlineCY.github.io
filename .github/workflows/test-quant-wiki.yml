name: Validate quant site content and navigation
on:
  push:
    branches: [main]
    paths:
      - 'quant/**'
      - 'scripts/test_published_site.mjs'
      - '.github/workflows/test-quant-wiki.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check glossary consistency and JavaScript syntax
        run: node quant/wiki/test_glossary.mjs
      - name: Verify all quant modules and data contracts
        run: node scripts/test_published_site.mjs
