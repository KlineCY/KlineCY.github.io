name: Validate quant finance wiki
on:
  push:
    branches: [main]
    paths:
      - 'quant/wiki/**'
      - 'quant/sidebar-v2.js'
      - '.github/workflows/test-quant-wiki.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check glossary consistency and JavaScript syntax
        run: node quant/wiki/test_glossary.mjs
