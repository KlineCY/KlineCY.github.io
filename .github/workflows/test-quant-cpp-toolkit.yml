name: Validate quant C++ research toolkit

on:
  push:
    paths:
      - 'quant/cpp/**'
      - 'quant/research/examples/**'
      - 'quant/research/numerical-examples/**'
      - 'quant/research/evidence-examples/**'
      - 'quant/research/inference-examples/**'
      - 'quant/research/applied-examples/**'
      - 'quant/research/methods-examples/**'
      - 'quant/research/depth-examples/**'
      - 'quant/research/model-examples/**'
      - 'quant/research/run_model_studies.py'
      - 'quant/research/model_study_common.py'
      - 'quant/research/run_depth_labs.py'
      - 'quant/research/run_methods_labs.py'
      - 'quant/research/run_applied_labs.py'
      - 'quant/research/run_researchflow.py'
      - 'quant/research/run_numerical_labs.py'
      - 'quant/research/run_evidence_labs.py'
      - '.github/workflows/test-quant-cpp-toolkit.yml'
  pull_request:
    paths:
      - 'quant/cpp/**'
      - 'quant/research/examples/**'
      - 'quant/research/numerical-examples/**'
      - 'quant/research/evidence-examples/**'
      - 'quant/research/inference-examples/**'
      - 'quant/research/applied-examples/**'
      - 'quant/research/methods-examples/**'
      - 'quant/research/depth-examples/**'
      - 'quant/research/model-examples/**'
      - 'quant/research/run_model_studies.py'
      - 'quant/research/model_study_common.py'
      - 'quant/research/run_depth_labs.py'
      - 'quant/research/run_methods_labs.py'
      - 'quant/research/run_applied_labs.py'
      - 'quant/research/run_researchflow.py'
      - 'quant/research/run_numerical_labs.py'
      - 'quant/research/run_evidence_labs.py'
      - '.github/workflows/test-quant-cpp-toolkit.yml'

jobs:
  research-toolkit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build C++17 CLI and numerical tests
        run: |
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic quant/cpp/cli.cpp -o /tmp/kline_quant
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic quant/cpp/test.cpp -o /tmp/kline_quant_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_advanced.cpp -o /tmp/kline_quant_advanced_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_fullstack.cpp -o /tmp/kline_quant_fullstack_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_expansion_math.cpp -o /tmp/kline_quant_expansion_math_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_expansion_finance.cpp -o /tmp/kline_quant_expansion_finance_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_research_math.cpp -o /tmp/kline_quant_research_math_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_research_finance.cpp -o /tmp/kline_quant_research_finance_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_crossdomain.cpp -o /tmp/kline_quant_crossdomain_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_sitewide_microstructure.cpp -o /tmp/kline_quant_sitewide_microstructure_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_sitewide_finance.cpp -o /tmp/kline_quant_sitewide_finance_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_sitewide_ml.cpp -o /tmp/kline_quant_sitewide_ml_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_sitewide_math.cpp -o /tmp/kline_quant_sitewide_math_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_massive_extension.cpp -o /tmp/kline_quant_massive_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_empirical_labs.cpp -o /tmp/kline_quant_empirical_labs_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_domain_labs.cpp -o /tmp/kline_quant_domain_labs_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_atlas2026.cpp -o /tmp/kline_quant_atlas2026_tests
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror quant/cpp/test_lab24.cpp -o /tmp/kline_quant_lab24_tests
      - name: Execute mathematical and financial numerical assertions
        run: |
          /tmp/kline_quant_tests
          /tmp/kline_quant_advanced_tests
          /tmp/kline_quant_fullstack_tests
          /tmp/kline_quant_expansion_math_tests
          /tmp/kline_quant_expansion_finance_tests
          /tmp/kline_quant_research_math_tests
          /tmp/kline_quant_research_finance_tests
          /tmp/kline_quant_crossdomain_tests
          /tmp/kline_quant_sitewide_microstructure_tests
          /tmp/kline_quant_sitewide_finance_tests
          /tmp/kline_quant_sitewide_ml_tests
          /tmp/kline_quant_sitewide_math_tests
          /tmp/kline_quant_massive_tests
          /tmp/kline_quant_empirical_labs_tests
          /tmp/kline_quant_domain_labs_tests
          /tmp/kline_quant_atlas2026_tests
          /tmp/kline_quant_lab24_tests
      - name: Exercise real CSV command line workflows
        run: |
          python quant/cpp/test_cli.py /tmp/kline_quant
          python quant/cpp/test_advanced_cli.py /tmp/kline_quant
          python quant/cpp/test_fullstack_cli.py /tmp/kline_quant
          python quant/cpp/test_expansion_math_cli.py /tmp/kline_quant
          python quant/cpp/test_expansion_finance_cli.py /tmp/kline_quant
          python quant/cpp/test_research_math_cli.py /tmp/kline_quant
          python quant/cpp/test_research_finance_cli.py /tmp/kline_quant
          python quant/cpp/test_crossdomain_cli.py /tmp/kline_quant
          python quant/cpp/test_sitewide_math_ml_cli.py /tmp/kline_quant
          python quant/cpp/test_sitewide_finance_cli.py /tmp/kline_quant
          python quant/cpp/test_massive_stats_cli.py /tmp/kline_quant
          python quant/cpp/test_massive_finance_cli.py /tmp/kline_quant
          python quant/cpp/test_empirical_labs_cli.py /tmp/kline_quant
          python quant/cpp/test_domain_labs_cli.py /tmp/kline_quant
          python quant/cpp/test_atlas2026_cli.py /tmp/kline_quant
          python quant/cpp/test_lab24_cli.py /tmp/kline_quant
          python quant/cpp/test_researchflow.py /tmp/kline_quant
          python quant/cpp/test_numerical_lab.py /tmp/kline_quant
          python quant/cpp/test_evidence.py /tmp/kline_quant
          python quant/cpp/test_inference_labs.py /tmp/kline_quant
          python quant/cpp/test_applied_labs.py /tmp/kline_quant
          python quant/cpp/test_methods_labs.py /tmp/kline_quant
          python quant/cpp/test_depth_labs.py /tmp/kline_quant
          python quant/cpp/test_model_research.py /tmp/kline_quant
      - name: Execute the complete research suite and chained model evaluations
        run: |
          python quant/research/run_researchflow.py /tmp/kline_quant /tmp/kline-research-results
          test -s /tmp/kline-research-results/derived/strategy_comparison.csv
          test -s /tmp/kline-research-results/derived/ridge_comparison.csv
          test -s /tmp/kline-research-results/derived/rolling_var_coverage.csv

      - name: Run all advanced numerical laboratories and six parameter studies
        run: |
          python quant/research/run_numerical_labs.py /tmp/kline_quant /tmp/kline-numerical-results
          test -s /tmp/kline-numerical-results/studies/put_call_parity.csv
          test -s /tmp/kline-numerical-results/studies/turnover_penalty_path.csv
          test -s /tmp/kline-numerical-results/studies/fitted_curve_keyrate.csv
          test -s /tmp/kline-numerical-results/studies/covariance_comparison.csv

      - name: Run evidence laboratories and linked pricing and market-design studies
        run: |
          python quant/research/run_evidence_labs.py /tmp/kline_quant /tmp/kline-evidence-results
          test -s /tmp/kline-evidence-results/studies/sdf_moment_check.csv
          test -s /tmp/kline-evidence-results/studies/call_curve_reconstruction.csv
          test -s /tmp/kline-evidence-results/studies/auction_conservation.csv
          test -s /tmp/kline-evidence-results/studies/margin_economic_equity.csv

      - name: Reproduce applied quantitative laboratories
        run: |
          python quant/research/run_applied_labs.py /tmp/kline_quant /tmp/kline-applied-results
          test $(find /tmp/kline-applied-results -name '*.csv' | wc -l) -eq 32

      - name: Reproduce quantitative research methods and linked studies
        run: |
          python quant/research/run_methods_labs.py /tmp/kline_quant /tmp/kline-methods-results
          test $(find /tmp/kline-methods-results/cases -name '*.csv' | wc -l) -eq 64
          test $(find /tmp/kline-methods-results/studies -name '*.csv' | wc -l) -eq 8

      - name: Reproduce deep research courses and integrated studies
        run: |
          python quant/research/run_depth_labs.py /tmp/kline_quant /tmp/kline-depth-results
          test $(find /tmp/kline-depth-results/cases -name '*.csv' | wc -l) -eq 96
          test $(find /tmp/kline-depth-results/studies -name '*.csv' | wc -l) -eq 16

      - name: Reproduce full model estimation and integrated numerical studies
        run: |
          python quant/research/run_model_studies.py /tmp/kline_quant /tmp/kline-model-results
          test $(find /tmp/kline-model-results/cases -name '*.csv' | wc -l) -eq 36
          test $(find /tmp/kline-model-results/studies -name '*.csv' | wc -l) -eq 22
