name: Validate strategy research backtesting engine
on:
  push:
    branches: [main]
    paths:
      - 'quant/research/**'
      - '.github/workflows/test-quant-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python engine and all strategy templates
        run: python -m unittest discover quant/research -p 'test_*.py' -v
