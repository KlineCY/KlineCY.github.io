name: Validate quant machine learning
on:
  push:
    branches: [main]
    paths:
      - 'quant/ml/**'
      - 'quant/sidebar-v2.js'
      - '.github/workflows/test-quant-ml.yml'
  pull_request:
    paths:
      - 'quant/ml/**'
      - 'quant/sidebar-v2.js'
      - '.github/workflows/test-quant-ml.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-math-and-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock katex@0.16.11
      - name: V89 verify mathematics foundation completion, strict equations and live ML prerequisites
        run: node quant/math/test_v89_12_complete_foundation_lessons.mjs
      - name: V88 validate information theory and NLP, sequence, graph, GAN and RL course depth
        run: node quant/math/test_v88_33_information_sequence.mjs
      - name: V87 verify live math and Atlas additions, strict TeX, CJK and numeric test coverage
        run: node quant/math/test_v87_31_rigorous_lessons.mjs
      - name: V86 validate quant math and ML original-content hashes, strict KaTeX and numerical invariants
        run: node quant/math/test_v86_29_rigorous_math_ml.mjs
      - name: V85 verify 19 math and 8 ML course extensions, numerical proofs and KaTeX/CJK layout
        run: node quant/math/test_v85_27_rigorous_lessons.mjs
      - name: V84 validate registered mathematics and ML Atlas course extensions and strict TeX
        run: node quant/math/test_v84_25_lesson_integrity.mjs
      - name: Verify V83 quantitative mathematics and Atlas ML cross-module integrity
        run: node quant/math/test_v83_21_math_ml_addenda.mjs
      - run: node quant/ml/test_ml.mjs
      - name: Verify published site is free of revision notes and obsolete artifacts
        run: node scripts/test_published_site.mjs
      - run: node quant/ml/test_concept_chapters.mjs
      - run: node quant/ml/test_concept_bridges.mjs
      - name: V111 verify 12 canonical math-ML bridges, 48 KaTeX expressions, CJK rendering and independent finance numerics
        run: |
          node --check quant/ml/atlas.js
          node --check quant/ml/concept-render.js
          node quant/ml/test_concept_bridges_v111.mjs
      - name: V112 audit 20 full CJK math-ML lessons, 80 strict KaTeX proofs, 80 verified links, numerical models and original source integrity
        run: |
          node --check quant/ml/atlas.js
          node --check quant/ml/concept-render.js
          node quant/ml/test_concept_bridges_v112.mjs
      - name: V113 audit original 720 Atlas lessons, 80 strict KaTeX proof sections, Chinese maths and financial calculations
        run: |
          node --check quant/ml/atlas.js
          node --check quant/ml/concept-render.js
          node quant/ml/test_concept_bridges_v113.mjs
      - name: V116 validate restored twenty PIT, regression, causal and ETF lessons, formulas, prerequisites and numerics
        run: |
          node --check quant/ml/atlas.js
          node quant/ml/test_concept_bridges_v114.mjs
      - name: V115 reader-first navigation, nested subject/chapter/topic, mobile and CJK formula layout
        run: |
          node --check quant/ml/atlas.js
          node --check quant/math/app.js
          node quant/ml/test_v115_reader_navigation.mjs
      - run: node quant/ml/test_new_topics.mjs
      - run: node quant/ml/test_volatility_chapter.mjs
      - run: node quant/ml/test_linear_regularization_chapter.mjs
      - run: node quant/ml/test_evaluation_evidence_chapter.mjs
      - run: node quant/ml/test_generalization_kernel_risk_v2.mjs
      - run: node quant/ml/test_v3_stability_robust.mjs
      - run: node quant/ml/test_v4_tailrisk_calibration.mjs
      - run: node quant/ml/test_v6_copula_multivariate.mjs
      - run: node quant/ml/test_quant_stage16_typography.mjs
      - run: node quant/ml/test_loader.mjs
      - run: node quant/ml/test_reader.mjs
      - run: node quant/ml/test_no_learning_progress.mjs
      - name: V41 verify full ninth-cycle 122 lectures and 610 strict KaTeX equations
        run: node quant/ml/test_v41_complete_ninth_122.mjs
      - name: V40 validate 122 ninth-stage lessons, 490 strict math formulas and 62 canonical links
        run: node quant/ml/test_v40_ninth_62.mjs
      - name: V39 verify full eighth-cycle 120 canonical lessons, 600 formulas and 12 study stages
        run: node quant/ml/test_v39_full_eighth_120.mjs
      - name: V38 validate 60 enriched eighth-stage lectures and 480 KaTeX formulas
        run: node quant/ml/test_v38_eighth_cycle_60.mjs
      - name: V37 complete seventh-cycle 96 lectures, 480 equations and 72 deep links
        run: node quant/ml/test_v37_complete_seventh_96.mjs
      - name: V36 verify 48 canonical math-heavy lessons, 240 formulas and 24 ML domains
        run: node quant/ml/test_v36_48_deep_mathematical_lessons.mjs
      - name: Verify V35 48 rigorous Atlas lectures and 240 KaTeX formulae
        run: node quant/ml/test_v35_48_atlas_lessons.mjs
      - name: Verify V34 32 deepened mathematical-ML lectures, numerics and Chinese layout
        run: node quant/ml/test_atlas_v34_deepening.mjs
      - run: node quant/math/test_v34_complete_canonical_core.mjs
      - run: node quant/math/test_v33_highfreq_ml_bridge.mjs
      - run: python quant/ml/tools/verify_atlas.py
      - name: V81 validate 30 generative, RL, time-series and production finance lectures
        run: node quant/math/test_v81_30_lesson_depth.mjs
      - name: V80 validate 60 deepened ML lectures, strict KaTeX, financial numerics and original-content fingerprints
        run: node quant/math/test_v80_60_lesson_integrity.mjs
      - name: V79 verify 62 original lessons, strict mathematical proof, numeric cases and CJK layout
        run: node quant/math/test_v79_62_lesson_integrity.mjs
      - name: V78 verify 56 live ML lessons, preserved source content, strict KaTeX and financial numerics
        run: node quant/math/test_v78_56_live_lesson_integrity.mjs
      - name: V77 validate 52 lectures, strict KaTeX, system-risk proofs and Chinese layout
        run: node quant/math/test_v77_52_systematic_lessons.mjs
      - name: V76 validate 45 live lessons, strict KaTeX, Chinese layout and independent numeric cases
        run: node quant/math/test_v76_45_lecture_integrity.mjs
      - name: V75 verify 46 lessons, source-vintage fix, strict KaTeX, CJK and financial numerics
        run: node quant/math/test_v75_46_financial_ml_depth.mjs
      - name: V74 verify 42 lectures with strict KaTeX, CJK typography and independent numerics
        run: node quant/math/test_v74_42_lesson_depth.mjs
      - name: V73 validate 34 deepened lessons, strict KaTeX, numerics and original-content guards
        run: node quant/math/test_v73_34_lesson_integrity.mjs
      - name: V72 verify 24 deepened lessons, strict math, independent numerics and CJK layout
        run: node quant/math/test_v72_extended_consistency.mjs
      - name: V70 validate 32 advanced econometrics and ML lessons, 60 numeric cases and CJK KaTeX
        run: node quant/math/test_v70_econometrics_generative_rl.mjs
      - name: V69 validate SDF, execution and 23 ML lectures, 53 arithmetic checks, strict KaTeX and CJK
        run: node quant/math/test_v69_sdf_execution_ml.mjs
      - name: V68 validate 32 causal and ML lectures, 62 numeric cases, strict KaTeX and CJK
        run: node quant/math/test_v68_causal_optimization_ml.mjs
      - name: V67 validate 31 rigorous training and ML lessons, 45 numerical cases and responsive CJK/KaTeX
        run: node quant/math/test_v67_training_robustness_ml.mjs
      - name: V66 validate 31 time-series and ML lessons, KaTeX, independent arithmetic and CJK layout
        run: node quant/math/test_v66_timeseries_ml_inference.mjs
      - name: V65 validate 27 cointegration and ML lessons, numerical examples and CJK KaTeX layout
        run: node quant/math/test_v65_cointegration_ml_foundations.mjs
      - name: V64 verify 26 curriculum lessons, strict math, CJK layout and independent arithmetic
        run: node quant/math/test_v64_foundations_calibration.mjs
      - name: V63 verify 18 dynamic-risk and ML lessons, numerical proof checks and CJK typography
        run: node quant/math/test_v63_dynamics_generalization.mjs
      - name: V62 check 15 robust inference and ML forecasting lessons, KaTeX and numerical identities
        run: node quant/math/test_v62_robust_forecasting.mjs
      - name: V61 verify Bayesian and particle math plus six ML fundamentals
        run: node quant/math/test_v61_bayesian_smc_ml.mjs
      - name: V60 verify filtering and six ML foundations, KaTeX and numerical identities
        run: node quant/math/test_v60_foundations.mjs
      - name: V59 verify policy improvement, doubly robust evaluation, DCC and short financing
        run: node quant/ml/test_v59_policy_dcc_accounting.mjs
  python-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy pandas scikit-learn
      - run: python -m unittest discover quant/ml -p 'test_*.py' -v
